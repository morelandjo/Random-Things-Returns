plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Team Reborn Energy (optional compile-only integration)
    maven { url = "https://maven.modmuss50.me/" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Team Reborn Energy — compile-only. NOT bundled, NOT required at runtime: FabricEnergyBridge
    // activates the integration only when another mod ships the API (see TREnergyCompat).
    modCompileOnly("teamreborn:energy:3.0.0") { transitive = false }

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // JEI - API for compile, full mod for runtime testing
    modCompileOnly "mezz.jei:jei-$rootProject.minecraft_version-common-api:$rootProject.jei_version"
    modCompileOnly "mezz.jei:jei-$rootProject.minecraft_version-fabric-api:$rootProject.jei_version"
    modLocalRuntime("mezz.jei:jei-$rootProject.minecraft_version-fabric:$rootProject.jei_version") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name
    inputs.property 'mod_description', rootProject.mod_description
    inputs.property 'mod_author', rootProject.mod_author
    inputs.property 'license', rootProject.license
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'fabric_loader_version', rootProject.fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_description: rootProject.mod_description,
            mod_author: rootProject.mod_author,
            license: rootProject.license,
            minecraft_version: rootProject.minecraft_version,
            fabric_loader_version: rootProject.fabric_loader_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
